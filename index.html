<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="application-name" content="TrackPicks" />
  <meta name="apple-mobile-web-app-title" content="TrackPicks" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
  <title>TrackPicks</title>
  <link rel="manifest" href="manifest.json?v=3.0.7" />
  <link rel="stylesheet" href="styles.css?v=3.0.7" />

  <style id="tp-2-6-weekend-nav-fix">
    .bottom-nav {
      position: fixed !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      margin-bottom: 0 !important;
      transform: none !important;
      padding-bottom: env(safe-area-inset-bottom, 0px) !important;
      z-index: 1000 !important;
    }
    [data-save-wager] {
      color: #fff !important;
      -webkit-text-fill-color: #fff !important;
      opacity: 1;
    }
    [data-save-wager]:disabled {
      color: #fff !important;
      -webkit-text-fill-color: #fff !important;
    }
  </style>
  <style id="tp-2-10-import-ui">
    .tp-import-header-btn{border:0;background:#111827;color:#fff;border-radius:10px;padding:9px 14px;font-weight:800;font-size:14px;cursor:pointer}
    .tp210-import .screenshot-import-page{background:#f6f7f9}.tp210-import-scroll{max-width:760px;margin:0 auto;width:100%}
    .tp-import-intro,.tp-confirm-batch,.tp-process-center{padding:22px 4px 40px}.tp-import-intro h2,.tp-confirm-batch h2,.tp-process-center h2{margin:6px 0 8px;font-size:26px}.tp-process-kicker{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;opacity:.55}
    .tp-import-rules{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px;margin:22px 0;box-shadow:0 2px 10px rgba(0,0,0,.04)}.tp-import-rules p{margin:12px 0 0;line-height:1.45}
    .tp-big-action{width:100%;min-height:52px;font-size:16px;margin-top:18px}.tp-thumb-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:20px 0}.tp-thumb{position:relative;aspect-ratio:9/16;background:#e5e7eb;border-radius:12px;overflow:hidden}.tp-thumb img{width:100%;height:100%;object-fit:cover}.tp-thumb button{position:absolute;right:6px;top:6px;width:30px;height:30px;border:0;border-radius:999px;background:#dc2626;color:#fff;font-size:22px;line-height:28px;font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,.25)}.tp-thumb span{position:absolute;left:7px;bottom:7px;background:rgba(0,0,0,.72);color:#fff;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:800}
    .tp-process-center{text-align:center;padding-top:14vh}.tp-process-count{font-size:34px;font-weight:900;margin:28px 0 12px}.tp-progress{height:12px;background:#e5e7eb;border-radius:999px;overflow:hidden;max-width:520px;margin:0 auto}.tp-progress span{display:block;height:100%;background:#111827;border-radius:999px;transition:width .25s ease}.tp-success-mark{width:58px;height:58px;border-radius:999px;background:#111827;color:#fff;display:grid;place-items:center;font-size:30px;font-weight:900;margin:0 auto 18px}.tp-diag-peek{text-align:left;margin-top:24px;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:12px 14px}
    .tp-review-leg{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.tp-leg-delete{flex:0 0 32px;width:32px;height:32px;border:0;border-radius:999px;background:#fee2e2;color:#b91c1c;font-size:22px;font-weight:900;line-height:30px}
    @media(max-width:520px){.tp-thumb-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.tp-import-intro h2,.tp-confirm-batch h2,.tp-process-center h2{font-size:23px}}
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="app.js?v=3.0.7"></script>
</body>
</html>
